# Las 36 suites, en cada cambio.
#
# Existe porque unas pruebas que solo se lanzan a mano acaban lanzándose
# cuando uno se acuerda, que es después de haber roto algo. Aquí las lanza
# GitHub: monta el escenario entero —servidores simulados, datos de ejemplo,
# la aplicación compilada— y falla el cambio si alguna se cae.
#
# Es exactamente el mismo `bash qa/todo.sh` que se usa en local. Si se rompe
# aquí, se reproduce ahí con una orden y sin adivinar qué hacía distinto.
name: Pruebas

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "apps/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      suites:
        description: "Solo estas suites (separadas por espacios). Vacío = todas."
        required: false
        default: ""

# Con `push` en todas las ramas, añadir `pull_request` hacía que cada empujón
# a una rama con PR abierto lanzara las 36 suites dos veces. Y si se empuja
# dos veces seguidas, la primera tanda ya no interesa: se cancela sola.
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    # Las 35 tardan unos cuatro minutos; con margen para una que se atasque
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependencias
        run: npm ci

      # El navegador con el que se abre la aplicación de verdad. Solo
      # Chromium: las suites no usan los otros y bajarlos son minutos.
      - name: Chromium para Playwright
        run: npx playwright install --with-deps chromium

      # Los vídeos de prueba se generan (no se guardan en el repositorio) y
      # para eso hace falta ffmpeg, que en ubuntu-latest NO viene. Aquí había
      # un «ffmpeg -version | head -1» que daba por bueno el paso aunque no
      # estuviera: el código de salida de una tubería es el del último
      # mandato, y `head` siempre acaba bien. Una comprobación que no puede
      # fallar es peor que ninguna, porque tapa lo que venía a mirar.
      - name: ffmpeg, para los vídeos de prueba
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version

      # Sin argumentos son las 35. Con ellos, solo esas: cuando una falla
      # aquí y no en local, repetirla sola deja el registro corto y con el
      # fallo a la vista, en vez de enterrado entre las otras treinta y cuatro.
      - name: Las suites
        run: bash qa/todo.sh ${{ inputs.suites }}

      # Cuando algo falla, la captura del momento dice más que el log
      - name: Guardar las capturas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: qa/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar los registros
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registros
          path: /tmp/qa-*.log
          if-no-files-found: ignore
          retention-days: 7
