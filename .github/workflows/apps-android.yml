# Compila los dos APK de Android en cada cambio.
#
# Existe porque compilar un APK necesita el SDK de Android —varios gigas— y no
# tenerlo instalado es justo lo que impide probar la aplicación: el proyecto
# está, pero nadie lo compila. Aquí lo hace GitHub, que ya trae el SDK, y deja
# los dos archivos descargables en la pestaña Actions.
#
# Son APK firmados de depuración: valen para instalar en un teléfono o una tele
# y para probarlos con clientes. Para Google Play hay que firmarlos con la
# clave propia — está explicado en apps/android/README.md.
name: Aplicaciones Android

on:
  push:
    branches: ["**"]
    paths:
      - "apps/android/**"
      - "apps/androidtv/**"
      - ".github/workflows/apps-android.yml"
  # Y a mano, desde la propia pestaña Actions
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    strategy:
      # Que falle la de tele no impide bajarse la de móvil
      fail-fast: false
      matrix:
        include:
          - nombre: movil
            carpeta: apps/android
          - nombre: tele
            carpeta: apps/androidtv
          # El reproductor nativo, el que no usa WebView. Convive con el de
          # arriba hasta que esté probado en un aparato de verdad.
          - nombre: tele-nativo
            carpeta: apps/androidtv-nativo
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # La versión va clavada: sin esto se usa la que traiga la máquina de
      # turno, y el complemento de Android solo admite una franja estrecha.
      # Cuando GitHub actualizó Gradle, la compilación se rompió sola sin
      # haber tocado el proyecto.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar ${{ matrix.nombre }}
        working-directory: ${{ matrix.carpeta }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: totalplayer-${{ matrix.nombre }}
          path: ${{ matrix.carpeta }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
