<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>TOTALplayer</title>
<style>
  /* Negro desde el primer fotograma: un fogonazo blanco en una tele de 55
     pulgadas se ve desde la cocina y parece que la aplicación ha fallado */
  html, body { margin: 0; height: 100%; background: #14131a; overflow: hidden; }
  #aviso {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2vh;
    color: #fff; font-family: system-ui, sans-serif; text-align: center;
  }
  #aviso b { color: #e5192b; letter-spacing: .18em; font-size: 1.8vw; }
  #aviso p { color: rgba(255,255,255,.55); font-size: 1.4vw; }
</style>
</head>
<body>
<!--
  La aplicación para televisores Samsung (Tizen).

  Abre la web dentro del televisor. Y la abre navegando, no dentro de un
  iframe: el sitio manda «X-Frame-Options: SAMEORIGIN» —que es lo que impide
  que un tercero lo meta en su página para robar contraseñas— y un televisor
  es, para el navegador, un origen distinto. Enmarcada, la aplicación salía
  en negro. Se comprueba que haya red, y solo entonces se salta.
-->
<div id="aviso"><b>TOTALPLAYER</b><p id="estado">Encendiendo…</p></div>
<script>
(function () {
  // La dirección de tu instalación. Es lo único que cambia un proveedor que
  // quiera esta misma aplicación con su marca.
  var INICIO = "https://xtreamplayer-production.up.railway.app/tv";

  var estado = document.getElementById("estado");
  var intentos = 0;

  /* Una tele enciende antes que el router: preguntamos si la web contesta y
     no saltamos hasta que lo haga. Saltar a ciegas deja al cliente mirando
     la pantalla de error del navegador, que no dice nada y no se reintenta. */
  function entrar() {
    intentos++;
    fetch(INICIO, { method: "HEAD", cache: "no-store", mode: "no-cors" })
      .then(function () { window.location.replace(INICIO); })
      .catch(function () {
        // A la segunda ya se dice qué pasa: tres segundos mirando
        // «Encendiendo…» es cuando se empieza a dudar del aparato
        estado.textContent = intentos < 2 ? "Encendiendo…" : "Buscando la conexión…";
        setTimeout(entrar, 3000);
      });
  }

  /* El mando: Tizen se queda las teclas de reproducción salvo que se las
     pidas una por una. Se registran aquí, antes de saltar, porque siguen
     valiendo para toda la aplicación. */
  try {
    if (window.tizen && tizen.tvinputdevice) {
      ["MediaPlayPause", "MediaPlay", "MediaPause", "MediaStop",
       "MediaRewind", "MediaFastForward", "ChannelUp", "ChannelDown"]
        .forEach(function (t) { try { tizen.tvinputdevice.registerKey(t); } catch (e) {} });
    }
  } catch (e) { /* en el emulador puede no existir */ }

  /* Salvapantallas fuera: ver una película es estar dos horas sin tocar el
     mando, y la tele lo interpreta como que no hay nadie delante */
  try {
    if (window.webapis && webapis.appcommon) {
      webapis.appcommon.setScreenSaver(webapis.appcommon.AppCommonScreenSaverState.SCREEN_SAVER_OFF);
    }
  } catch (e) { /* idem */ }

  /* El ATRÁS del mando (10009) lo recibe la web, que sabe deshacer un paso
     cada vez. Aquí no se toca: gestionarlo también desde fuera es lo que
     hace que un solo ATRÁS retroceda dos pantallas. */

  entrar();
})();
</script>
</body>
</html>
