plugins { id 'com.android.application' }

android {
    namespace 'app.totalplayer.tv'
    compileSdk 34

    defaultConfig {
        applicationId "app.totalplayer.tv"
        // Android 5: es lo que llevan las teles y los Fire TV más viejos que
        // siguen en las casas. Pedir más deja fuera a clientes de verdad.
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    /*
     * El puente de descargas es el mismo en las dos aplicaciones de Android.
     *
     * Se comparte el fichero en vez de copiarlo: son dos proyectos Gradle
     * distintos porque una va a la tienda de televisores y la otra a la de
     * móviles, pero descargar una película es exactamente lo mismo en las dos
     * y dos copias se separan al primer arreglo.
     */
    sourceSets { main { java.srcDirs += ['../../comun/java'] } }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies { }
