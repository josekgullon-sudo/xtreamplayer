<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>TOTALplayer</title>
<style>
  html, body { margin: 0; height: 100%; background: #14131a; overflow: hidden; }
  #aviso {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2vh;
    color: #fff; font-family: system-ui, sans-serif; text-align: center;
  }
  #aviso b { color: #e5192b; letter-spacing: .18em; font-size: 1.8vw; }
  #aviso p { color: rgba(255,255,255,.55); font-size: 1.4vw; }
</style>
</head>
<body>
<!--
  La aplicación para televisores LG (webOS). Lo mismo que la de Samsung: abre
  la web navegando —no en un iframe, que el sitio no se deja enmarcar desde
  otro origen y quedaría en negro— y antes comprueba que haya red.
-->
<div id="aviso"><b>TOTALPLAYER</b><p id="estado">Encendiendo…</p></div>
<script>
(function () {
  // La dirección de tu instalación: lo único que cambia una marca blanca
  var INICIO = "https://totalplayer.app/tv?app=1";

  var estado = document.getElementById("estado");
  var intentos = 0;

  function entrar() {
    intentos++;
    fetch(INICIO, { method: "HEAD", cache: "no-store", mode: "no-cors" })
      .then(function () { window.location.replace(INICIO); })
      .catch(function () {
        // A la segunda ya se dice qué pasa: tres segundos mirando
        // «Encendiendo…» es cuando se empieza a dudar del aparato
        estado.textContent = intentos < 2 ? "Encendiendo…" : "Buscando la conexión…";
        setTimeout(entrar, 3000);
      });
  }

  /* Salvapantallas fuera mientras la aplicación esté delante: ver una
     película es estar dos horas sin tocar el mando */
  try {
    if (window.webOS && webOS.service) {
      webOS.service.request("luna://com.webos.settingsservice", {
        method: "setSystemSettings",
        parameters: { category: "option", settings: { screenSaverTime: "0" } },
      });
    }
  } catch (e) { /* fuera de la tele no existe */ }

  /* El ATRÁS del mando de LG es el 461 y lo recibe la web, que sabe deshacer
     un paso cada vez: vídeo → episodios → carpeta → portada. */

  entrar();
})();
</script>
</body>
</html>
